<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Classes — Agenda Cégep</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f2123">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon-180.png">
<style>
/* Page sœur de l'agenda : mêmes jetons, même langage — cartes blanches à
   grand rayon, une carte inversée comme point focal, étiquettes mono. */
:root{
  --bg:#E6E9EE; --bg-2:#F1F4F8; --bg-3:#DBE1E9;
  --surface:#FFFFFF; --surface-2:#F2F5F8; --surface-3:#E9EDF2;
  --invert:#1C3D5D; --invert-2:#28527A; --on-invert:#FFFFFF; --ac:#3A6EA5;
  --ink:#16171A; --dim:#5F646A; --faint:#6E737A;
  --line:rgba(0,0,0,.075); --line-hi:rgba(0,0,0,.14);
  --live:#D0402F; --live-hi:#FF8B7C;
  --invert-soft:rgba(255,255,255,.10); --invert-soft-2:rgba(255,255,255,.19);
  --evt-bg:.20; --evt-bd:.42; --evt-tx:32%;
  --shadow:0 1px 2px rgba(16,18,20,.05), 0 14px 34px -22px rgba(16,18,20,.45);
  --shadow-hi:0 2px 4px rgba(16,18,20,.08), 0 26px 48px -20px rgba(16,18,20,.5);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  /* Le pli de la barre latérale : une seule durée, une seule courbe, pour
     que largeur, rembourrages et libellés glissent d'un seul mouvement.
     Mêmes valeurs que dans l'agenda — la barre est la même, elle doit se
     replier au même rythme d'une page à l'autre. */
  --fold:.34s; --fold-e:cubic-bezier(.32,.72,0,1);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0C0D10; --bg-2:#101216; --bg-3:#090A0C;
  --surface:#141619; --surface-2:#1B1D21; --surface-3:#222429;
  --invert:#E8EDF3; --invert-2:#DDE3EA; --on-invert:#14243A; --ac:#7FA8CF;
  --ink:#F1F3F5; --dim:#A8AEB5; --faint:#8A9199;
  --line:rgba(255,255,255,.09); --line-hi:rgba(255,255,255,.19);
  --live:#FF6B58; --live-hi:#C2372A;
  --invert-soft:rgba(0,0,0,.06); --invert-soft-2:rgba(0,0,0,.12);
  --evt-bg:.26; --evt-bd:.40; --evt-tx:78%;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 14px 34px -22px rgba(0,0,0,.8);
  --shadow-hi:0 2px 4px rgba(0,0,0,.45), 0 26px 48px -18px rgba(0,0,0,.85);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
h1,h2,h3,h4,p,ul,ol{margin:0}
body{
  margin:0;padding:clamp(.6rem,1.4vw,1.3rem);min-height:100vh;
  background:var(--bg);
  background-image:radial-gradient(90% 70% at 78% -8%, var(--bg-2) 0%, transparent 60%),
                   radial-gradient(80% 60% at 8% 105%, var(--bg-3) 0%, transparent 65%);
  background-attachment:fixed;
  color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
svg.i{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

/* width:100% n'est pas décoratif : sans lui, ce conteneur flex est
   dimensionné par le min-content de son contenu (une bulle de discussion
   en nowrap, par exemple) et déborde l'écran du téléphone. */
.wrap{max-width:84rem;width:100%;min-width:0;margin:0 auto;display:flex;flex-direction:column;gap:1.1rem}
.card,.rows,.row,.teaser,.pad,.volet,.grp{min-width:0}
.grow{flex:1 1 auto}
.dim{color:var(--dim)}
.mono{font-family:var(--mono)}

/* ── Barre latérale ───────────────────────────────────────────────
   Celle de l'agenda, portée ici : la navigation ne doit pas s'interrompre
   au passage d'une page à l'autre. Ses entrées renvoient à l'agenda par son
   routeur (« /#/horaire », « /#/profil »…), qui ouvre la bonne vue dès le
   chargement — voir lisRoute() et enterBoard() là-bas.

   Ce qu'elle ne porte pas, et pourquoi : les compteurs et la liste des
   matières demandent l'horaire complet et ses retouches, qu'on ne
   reconstruit pas d'ici — un chiffre faux vaut moins que pas de chiffre ;
   « Fins de semaine » et « Imprimer » règlent la grille de l'agenda et
   n'auraient, sur cette page, aucun effet à montrer.

   L'intertitre s'appelle .sgrp et non .grp : .grp sert déjà ici aux
   groupes de champs des formulaires. */
.shell{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.85rem;align-items:start}
.main{min-width:0}
.side{
  position:sticky;top:calc(.6rem + env(safe-area-inset-top, 0px));background:var(--surface);border-radius:30px;
  padding:1.3rem 1rem 1.1rem;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:.15rem;max-height:calc(100vh - 1.6rem);max-height:calc(100dvh - 1.6rem);
  /* Le débord horizontal est coupé : pendant le pli, les libellés qui
     rétrécissent ne doivent pas faire naître une barre de défilement. */
  overflow:hidden auto;overscroll-behavior:contain;
  width:15.5rem;transition:width var(--fold) var(--fold-e),padding var(--fold) var(--fold-e);
}
/* Le haut de la barre ne part pas avec le défilement : la marque et le pli
   restent en tête pendant que les matières glissent dessous. Le bandeau
   reprend à son compte la gouttière de la barre — marges négatives, puis son
   propre rembourrage — sinon son fond s'arrêterait au ras du texte et une
   entrée se verrait passer au-dessus, dans le coin arrondi. Le `top` négatif
   annule la marge du haut : le collage se mesure sur la boîte de marge, et
   sans lui le bandeau se figerait 1,3 rem trop bas. Le fond s'éteint sur son
   dernier centimètre : ce qui file dessous se dissout au lieu de buter sur
   une arête. */
.sidetop{position:sticky;top:-1.3rem;z-index:3;
  margin:-1.3rem -1rem 0;padding:1.3rem 1rem 1.4rem;
  background:linear-gradient(180deg,var(--surface) calc(100% - 1.1rem),transparent);
  display:flex;align-items:center;gap:.35rem;
  transition:gap var(--fold) var(--fold-e),padding var(--fold) var(--fold-e)}
.sidetop .brand{width:auto;flex:1 1 auto;min-width:0;padding:0 .55rem;
  transition:gap var(--fold) var(--fold-e),padding var(--fold) var(--fold-e)}
.sfold{width:2.1rem;height:2.1rem;border-radius:10px;color:var(--faint);display:grid;place-items:center;flex:0 0 auto;
  transition:background .15s,color .15s,transform var(--fold) var(--fold-e)}
.sfold:hover{background:var(--surface-2);color:var(--ink)}
.navi{display:flex;align-items:center;gap:.7rem;padding:.62rem .7rem;border-radius:14px;
  color:var(--dim);font-size:.9rem;text-decoration:none;width:100%;text-align:left;
  transition:background .15s,color .15s,gap var(--fold) var(--fold-e),padding var(--fold) var(--fold-e)}
.navi:hover{background:var(--surface-2);color:var(--ink)}
.navi.on{background:var(--invert);color:var(--on-invert)}
.navi.on:hover{background:var(--invert);color:var(--on-invert)}
.sgrp{padding:1.2rem .75rem .4rem;font-size:.66rem;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);
  border-top:1px solid transparent;
  transition:color .16s ease .16s,font-size var(--fold) var(--fold-e),
             padding var(--fold) var(--fold-e),border-color .2s ease .14s}
.lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navi .lb{flex:1 1 auto;min-width:0}
.side .grow{flex:1 1 auto;min-height:1rem}
.side .brand b,.side .lb{transition:opacity .16s ease .16s}
/* Déconnecté, l'agenda cache sa barre : la porte d'entrée passe avant. La
   page Classes fait pareil, sinon on offrirait une navigation d'app à
   quelqu'un qui n'a encore rien à y voir. */
body.lp .side,body.lp .tabbar{display:none}
body.lp .shell{grid-template-columns:minmax(0,1fr)}

/* ── Barre latérale pliée ──────────────────────────────────────────
   Pliée, la barre ne disparaît pas : elle se réduit à ses icônes. Les
   libellés s'effacent AVANT que la largeur ne bouge et ne reviennent
   qu'une fois la place reprise — sans ce décalage, le texte se ferait
   pincer pendant le glissement. Sous 761 px la barre est une rangée
   d'icônes en travers de l'écran : le pli n'y a plus rien à gagner. */
@media (min-width:761px){
  .side.mini{width:4.5rem;padding-left:.6rem;padding-right:.6rem}
  .side.mini .sidetop{flex-direction:column;gap:.5rem;
    margin-left:-.6rem;margin-right:-.6rem;padding:1.3rem .6rem 1.1rem}
  .side.mini .sfold{transform:rotate(180deg)}
  .side.mini .navi,.side.mini .brand{gap:0;justify-content:center;padding-left:0;padding-right:0}
  .side.mini .brand b,.side.mini .lb{
    opacity:0;flex:0 0 0;width:0;min-width:0;margin-left:0;
    transition-delay:0s;transition-duration:.1s}
  /* L'intertitre perd son mot mais garde son office : il devient le filet
     qui sépare les familles d'icônes. */
  .side.mini .sgrp{color:transparent;font-size:0;white-space:nowrap;
    padding:.8rem .3rem .35rem;border-top-color:var(--line);
    transition-delay:0s;transition-duration:.12s}
}

/* ── Téléphone ────────────────────────────────────────────────────
   Même partage que dans l'agenda : les cinq ancres du tableau passent
   dans la barre d'onglets du bas, sous le pouce ; la barre du haut ne
   garde que les entrées rares et défile avec la page. */
@media (max-width:760px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:static;flex-direction:row;flex-wrap:wrap;gap:.35rem;max-height:none;
    border-radius:22px;padding:.8rem;width:auto}
  .sidetop{position:static;width:100%;margin:0;padding:0;background:none}
  .sfold{display:none}
  .sidetop .brand{padding:0 .5rem}
  .sgrp,.side .grow{display:none}
  .navi{width:auto}
  .side .navi[data-go]{display:none}
  body{padding-bottom:calc(4.4rem + env(safe-area-inset-bottom, 0px))}
  body.lp{padding-bottom:clamp(.6rem,1.4vw,1.3rem)}
}

/* ── Barre d'onglets (téléphone) ──────────────────────────────────
   Fixée au bas, givrée. z-index 40 comme dans l'agenda : rien ici ne
   flotte au-dessus, mais les deux pages doivent rester interchangeables
   le jour où quelque chose s'y ajoute. */
.tabbar{display:none}
@media (max-width:760px){
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;
    display:flex;gap:.15rem;
    padding:.4rem .5rem calc(.4rem + env(safe-area-inset-bottom, 0px));
    background:color-mix(in srgb,var(--surface) 88%,transparent);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border-top:1px solid var(--line)}
  .tabbar .navi{flex:1 1 0;min-width:0;flex-direction:column;align-items:center;gap:.18rem;
    padding:.32rem 0 .26rem;font-size:.58rem;letter-spacing:.02em;border-radius:12px;text-align:center}
  .tabbar .navi .i{width:20px;height:20px;flex:0 0 auto}
  .tabbar .tbl{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
}

/* ── En-tête ── */
.head{display:flex;align-items:center;gap:.8rem;padding:.4rem .2rem 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.6rem;text-decoration:none}
.brand .mk{width:2.1rem;height:2.1rem;border-radius:9px;background:var(--invert);color:var(--on-invert);display:grid;place-items:center;flex:0 0 auto}
.brand b{font-size:1.18rem;font-weight:650;letter-spacing:-.03em}
.who{font-size:.72rem;color:var(--faint)}
.sortir{font-size:.74rem;min-height:2rem;padding:.3rem .7rem;border-radius:999px}
.crumbs{display:flex;align-items:center;gap:.45rem;flex-wrap:wrap;padding:0 .2rem;font-size:.85rem;color:var(--dim);min-height:1.3rem}
.crumbs a{text-decoration:none;transition:color .15s;padding:.3rem 0}
.crumbs a:hover{color:var(--ink)}
.crumbs b{color:var(--ink);font-weight:600;letter-spacing:-.015em}
.crumbs .sep{color:var(--faint)}
.flash{
  margin:0 .2rem;padding:.7rem 1rem;border-radius:14px;font-size:.85rem;
  background:var(--surface);box-shadow:var(--shadow);
}
.flash.err{color:var(--live)}

/* ── Sections + cartes ── */
.sect{display:flex;align-items:center;gap:.6rem;padding:.5rem .35rem .6rem;flex-wrap:wrap}
.sect h2{font-size:1.06rem;font-weight:650;letter-spacing:-.02em}
.card{background:var(--surface);border-radius:26px;box-shadow:var(--shadow);overflow:hidden}
.card.dark{background:var(--invert);color:var(--on-invert)}
.card.dark .dim{color:rgba(255,255,255,.62)}
:root[data-theme="dark"] .card.dark .dim{color:rgba(0,0,0,.6)}
.pad{padding:1.3rem 1.45rem 1.4rem;display:flex;flex-direction:column;gap:.7rem}
.pad>h2{font-size:1.32rem;font-weight:680;letter-spacing:-.03em}

/* ── Boutons + champs ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;background:var(--surface-2);border-radius:12px;padding:.62rem 1rem;min-height:2.6rem;font-size:.85rem;font-weight:550;transition:opacity .15s,background .15s,transform .15s}
.btn:hover{background:var(--surface-3)}
.btn:active{transform:scale(.98)}
.btn.solid{background:var(--invert);color:var(--on-invert)}
.btn.solid:hover{background:var(--invert);opacity:.85}
.btn.quiet{background:none;color:var(--dim)}
.sect .btn{background:var(--surface);box-shadow:var(--shadow);color:var(--dim);padding:.5rem .9rem;min-height:2.6rem;font-size:.82rem}
.sect .btn:hover{color:var(--ink)}
.btn.quiet:hover{color:var(--ink);background:var(--surface-2)}
.btn.danger{background:none;color:var(--live)}
.btn.danger:hover{background:var(--surface-2)}
.btn[disabled]{opacity:.45;cursor:default}
/* Un geste qui porte l'écran prend toute la largeur du champ qu'il valide. */
.btn.grand{width:100%;max-width:21rem;min-height:3rem;font-size:.92rem;border-radius:15px}
.card.dark .btn{background:var(--invert-2);color:var(--on-invert)}
.card.dark .btn.solid{background:var(--on-invert);color:var(--invert)}
.card.dark .btn.solid:hover{opacity:.87}
.card.dark .btn.quiet{background:none;opacity:.7}
.card.dark .btn.quiet:hover{opacity:1;background:var(--invert-soft)}
.card.dark .field{background:var(--invert-soft);border-color:transparent;color:var(--on-invert)}
.card.dark .field::placeholder{color:currentColor;opacity:.45}
.card.dark .field:focus{outline-color:var(--on-invert)}
.field{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:.58rem .85rem;font:inherit;color:var(--ink);min-width:0}
.field::placeholder{color:var(--faint)}
.field:focus{outline:2px solid var(--ac);outline-offset:1px}
.frow{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.frow .field{flex:1 1 10rem}

/* ── Tuiles (classes, matières) ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:.85rem}
.tile{position:relative;display:flex;flex-direction:column;gap:.35rem;padding:1.2rem 1.3rem 1.25rem;text-decoration:none;transition:transform .18s,box-shadow .18s}
.tile:hover{transform:translateY(-3px);box-shadow:var(--shadow-hi)}
/* Le monogramme donne une couleur stable à chaque classe ; la flèche ne se
   montre qu'au survol — la tuile promet d'ouvrir sans le crier. */
.tmono{width:2.7rem;height:2.7rem;border-radius:13px;display:grid;place-items:center;margin-bottom:.45rem;
  font-size:1.05rem;font-weight:650;
  background:hsl(var(--h,222) 62% 55% / var(--evt-bg));color:hsl(var(--h,222) 62% var(--evt-tx))}
.tile .go{position:absolute;top:1.1rem;right:1.1rem;width:2.1rem;height:2.1rem;border-radius:50%;display:grid;place-items:center;
  background:var(--surface-2);color:var(--dim);opacity:0;transform:translateX(-6px);transition:opacity .18s,transform .18s}
.tile:hover .go{opacity:1;transform:translateX(0)}
.tile .go .i{width:16px;height:16px}
.tile b{font-size:1rem;font-weight:600;letter-spacing:-.015em}
.tile .meta{font-size:.8rem;color:var(--dim)}
.pipline{display:flex;align-items:center;gap:.55rem}
.pip{width:.62rem;height:.62rem;border-radius:50%;flex:0 0 auto;background:hsl(var(--h,222) 62% 55%)}
.chipcode{font-size:.72rem;letter-spacing:.14em;color:var(--faint);margin-top:.25rem}

/* Le code d'adhésion, gros et copiable : c'est la porte de la classe. */
.codebox{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}

/* ── Rangées (cours, révisions, membres) ── */
.rows{display:flex;flex-direction:column;padding:.3rem .55rem .75rem}
.row{display:flex;align-items:center;gap:.85rem;padding:.72rem .75rem;border-radius:14px;text-decoration:none;transition:background .15s}
.row:hover{background:var(--surface-2)}
.row .stamp{font-family:var(--mono);font-size:.68rem;color:var(--faint);width:5.4rem;flex:0 0 auto}
.row>b{font-weight:550;font-size:.92rem;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .chev{color:var(--faint);flex:0 0 auto}
/* Deux lignes dans une rangée : le titre coupe, le détail suit dessous —
   la même rangée tient sur un téléphone comme sur un écran large. */
.rowcol{display:flex;flex-direction:column;gap:.1rem;min-width:0;flex:1 1 auto}
.rowcol b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowcol .meta{font-size:.76rem;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vide{padding:1.1rem 1.35rem 1.2rem;font-size:.85rem;line-height:1.5;color:var(--dim)}
.vide.hi{padding-bottom:.4rem}
/* Une carte, un sujet : le formulaire d'ajout vit sous la liste, pas dans
   une deuxième boîte qui répète la même frontière. */
.pied{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;padding:.85rem 1.35rem 1.05rem;border-top:1px solid var(--line)}
.pied .field{flex:1 1 11rem}
.pied.nu{border-top:0;padding-top:.2rem}
/* Deux sorties côte à côte : elles partagent la ligne, puis s'empilent
   pleine largeur quand il n'y a plus de place. */
.pied.duo .btn{flex:1 1 12rem}

/* ── Page d'écriture : une surface blanche qui grandit avec le texte. ── */
.page{
  width:100%;min-height:22rem;background:none;border:none;resize:none;
  color:var(--ink);font:inherit;font-size:.92rem;line-height:1.7;
  padding:.2rem 1.45rem 1.5rem;overflow:hidden;display:block;
}
.page:focus{outline:none}
.page::placeholder{color:var(--faint)}
.titre{
  width:100%;background:none;border:none;color:var(--ink);
  font-family:var(--font);font-size:1.35rem;font-weight:650;letter-spacing:-.025em;
  padding:1.15rem 1.45rem .1rem;
}
.titre:focus{outline:none}
.titre::placeholder{color:var(--faint)}
.pmeta{display:flex;align-items:center;gap:.7rem;padding:.15rem 1.45rem .6rem;flex-wrap:wrap}
.pmeta .field{padding:.3rem .6rem;font-size:.8rem}
.pat{font-family:var(--mono);font-size:.66rem;color:var(--faint)}

/* ── Révision : la page à gauche, la fouille à droite. ── */
.split{display:grid;grid-template-columns:minmax(0,1fr) 19rem;gap:.85rem;align-items:start}
.fouille{display:flex;flex-direction:column;gap:.1rem;padding:.55rem .8rem .9rem}
.fouille details{border-radius:14px}
.fouille summary{
  display:flex;align-items:center;gap:.7rem;padding:.6rem .6rem;border-radius:14px;
  cursor:pointer;list-style:none;transition:background .15s;
}
.fouille summary::-webkit-details-marker{display:none}
.fouille summary:hover{background:var(--surface-2)}
.fouille summary .stamp{font-family:var(--mono);font-size:.66rem;color:var(--faint);flex:0 0 auto}
.fouille summary b{font-size:.84rem;font-weight:550}
.exc{
  margin:.15rem .6rem .6rem;padding:.7rem .8rem;border-radius:12px;background:var(--surface-2);
  font-size:.8rem;line-height:1.55;white-space:pre-wrap;max-height:14rem;overflow:auto;
}
.exc.off{color:var(--faint);white-space:normal}
.fouille .btn{margin:.1rem .6rem .5rem;align-self:flex-start}
.fouille details>*:not(summary){display:flex;flex-direction:column}

.acts{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.footacts{display:flex;gap:.5rem;padding:.2rem .35rem 1rem;flex-wrap:wrap}

/* ── Élèves, examens, discussion ── */
.badge{font-size:.64rem;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);border:1px solid var(--line-hi);border-radius:999px;padding:.1rem .5rem;flex:0 0 auto}
.pill{font-size:.7rem;font-weight:650;background:var(--live);color:#fff;border-radius:999px;padding:.06rem .45rem;flex:0 0 auto}
.row .field{padding:.4rem .7rem;min-height:2.4rem;font-size:.85rem;max-width:13rem}
.row .meta{font-size:.78rem;color:var(--dim)}
.teaser{display:flex;flex-direction:column;gap:.5rem;padding:1.1rem 1.3rem 1.2rem;text-decoration:none;transition:transform .18s,box-shadow .18s}
.teaser:hover{transform:translateY(-2px);box-shadow:var(--shadow-hi)}
.teaser .ex{font-size:.85rem;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Un aperçu de message se coupe ; une invitation à écrire, non. */
.teaser .ex.libre{white-space:normal;line-height:1.5}

/* Le fil : des bulles, les tiennes à droite, une pastille par journée. */
.fil{display:flex;flex-direction:column;gap:.5rem;padding:1.1rem 1.1rem .4rem;max-height:min(62vh,40rem);overflow:auto}
.jour{align-self:center;font-family:var(--mono);font-size:.64rem;color:var(--faint);padding:.15rem .65rem;background:var(--surface-2);border-radius:999px;margin:.55rem 0 .15rem}
.msg{max-width:min(34rem,86%);align-self:flex-start;background:var(--surface-2);border-radius:17px;padding:.5rem .85rem .6rem}
.msg.moi{align-self:flex-end;background:var(--invert);color:var(--on-invert)}
.msgh{display:flex;align-items:baseline;gap:.55rem}
.msgh b{font-size:.77rem;font-weight:600;letter-spacing:-.01em}
.msgh .stampt{font-family:var(--mono);font-size:.62rem;color:var(--faint)}
.msg.moi .msgh .stampt{color:rgba(255,255,255,.5)}
:root[data-theme="dark"] .msg.moi .msgh .stampt{color:rgba(0,0,0,.45)}
.msgt{font-size:.9rem;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.msgx{background:none;font-size:.68rem;opacity:.5;padding:.3rem .4rem;margin:-.3rem -.4rem}
.msgx:hover{opacity:1}
.compo{display:flex;gap:.5rem;align-items:flex-end;padding:.7rem .9rem 1rem;border-top:1px solid var(--line)}
.compo textarea{flex:1 1 auto;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:.55rem .85rem;font:inherit;font-size:.9rem;color:var(--ink);resize:none;max-height:9rem;overflow:auto}
.compo textarea:focus{outline:2px solid var(--ac);outline-offset:1px}


/* ── Entrer dans une classe ────────────────────────────────────────
   Presque personne ne crée une classe ; presque tout le monde tape un
   code une fois, souvent au téléphone, souvent en le lisant à voix
   haute. Le champ mérite donc d'être l'écran : six cases, un caractère
   chacune, et un état visible à chaque frappe. */
.entree{gap:.95rem}
.entree h2{font-size:1.32rem;font-weight:680;letter-spacing:-.03em}
.entree h3{font-size:1.06rem;font-weight:650;letter-spacing:-.02em}
.sous{font-size:.85rem;line-height:1.55;max-width:34rem}

.segs{display:inline-flex;gap:.2rem;padding:.22rem;border-radius:15px;background:var(--surface-2);align-self:flex-start}
.seg{padding:.5rem 1rem;border-radius:12px;font-size:.85rem;font-weight:550;color:var(--dim);transition:background .15s,color .15s,opacity .15s}
.seg:hover{color:var(--ink)}
.seg[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(16,18,20,.07)}
.card.dark .segs{background:var(--invert-soft)}
.card.dark .seg{color:inherit;opacity:.6}
.card.dark .seg:hover{opacity:.85}
.card.dark .seg[aria-selected="true"]{opacity:1;background:var(--invert-soft-2);box-shadow:none}

.volet{display:flex;flex-direction:column;gap:.9rem}
.volet[hidden]{display:none}
.grp{display:flex;flex-direction:column;gap:.5rem}

/* Six cases, une grille : elles rétrécissent au lieu de déborder. Le vrai
   champ est transparent par-dessus — un seul curseur, le collage et le
   clavier du téléphone marchent sans gymnastique de focus. */
.cases{position:relative;display:grid;grid-template-columns:repeat(6,1fr);gap:.4rem;width:100%;max-width:21rem}
.cases .raw{position:absolute;inset:0;width:100%;height:100%;padding:0;margin:0;border:0;background:none;
  font:inherit;color:transparent;caret-color:transparent;opacity:0;cursor:text;overflow:hidden}
.case{
  aspect-ratio:1/1.16;border-radius:14px;display:grid;place-items:center;position:relative;
  background:var(--surface-2);border:1.5px solid var(--line);
  font-family:var(--mono);font-size:clamp(1rem,5vw,1.3rem);font-weight:650;
  transition:border-color .16s,background .16s,transform .16s;
}
.case.plein{background:var(--surface);border-color:var(--line-hi)}
.case.on{border-color:var(--ink);transform:translateY(-2px)}
.case.on::after{content:"";position:absolute;width:2px;height:1.3rem;border-radius:2px;background:var(--ink);animation:cligne 1.06s steps(1,end) infinite}
@keyframes cligne{0%,49%{opacity:1}50%,100%{opacity:0}}
.card.dark .case{background:var(--invert-soft);color:var(--on-invert);border-color:var(--invert-soft-2)}
.card.dark .case.plein{background:var(--invert-soft-2);border-color:transparent}
.card.dark .case.on{border-color:var(--on-invert)}
.card.dark .case.on::after{background:var(--on-invert)}
.cases.bad .case{border-color:var(--live)}
.card.dark .cases.bad .case{border-color:var(--live-hi)}
.cases.secoue{animation:secousse .4s}
@keyframes secousse{20%{transform:translateX(-6px)}45%{transform:translateX(6px)}70%{transform:translateX(-3px)}}

/* Une seule ligne dit toujours où on en est : consigne, attente, échec. */
.hint{display:flex;align-items:center;gap:.5rem;font-size:.8rem;line-height:1.4;color:var(--dim);min-height:1.2rem}
.hint.bad{color:var(--live);font-weight:550}
.card.dark .hint{color:inherit;opacity:.65}
.card.dark .hint.bad{opacity:1;color:var(--live-hi)}
.spin{width:.85rem;height:.85rem;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:tourne .7s linear infinite;flex:0 0 auto;opacity:.7}
@keyframes tourne{to{transform:rotate(360deg)}}

/* L'arrivée : une coche qui se trace, puis la seule question qui reste —
   sous quel nom la classe te voit. */
.solo{max-width:37rem;width:100%;align-self:center}
.entre{animation:monte .42s cubic-bezier(.2,.7,.3,1)}
@keyframes monte{from{opacity:0;transform:translateY(12px)}}
.tick{width:2.7rem;height:2.7rem;border-radius:50%;background:var(--invert-soft-2);display:grid;place-items:center;flex:0 0 auto}
.tick svg{width:1.4rem;height:1.4rem;stroke-width:2.4}
.tick path{animation:trace .5s ease-out}
@keyframes trace{from{stroke-dasharray:26;stroke-dashoffset:26}to{stroke-dasharray:26;stroke-dashoffset:0}}
.chap{display:flex;align-items:center;gap:.85rem}
.chap h2{font-size:1.32rem;font-weight:680;letter-spacing:-.03em;overflow-wrap:anywhere}
.chap .col{display:flex;flex-direction:column;gap:.2rem;min-width:0}
.label{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:600}
.card.dark .label{color:inherit;opacity:.55}

/* Le code d'une classe se lit à voix haute et se colle dans un groupe :
   les deux gestes sont là, le lien devant. */
.codetag{display:inline-flex;align-items:center;gap:.55rem;background:var(--invert-soft);border-radius:15px;padding:.6rem .9rem;transition:background .15s}
.codetag:hover{background:var(--invert-soft-2)}
.codetag .code{font-family:var(--mono);font-size:clamp(1.3rem,6vw,1.6rem);font-weight:680;letter-spacing:.22em;padding-left:.22em}
.codetag .i{opacity:.55;width:17px;height:17px}

/* Un visage par élève : l'initiale suffit à rendre la liste lisible. */
.ava{width:2.1rem;height:2.1rem;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;
  font-size:.82rem;font-weight:650;letter-spacing:0;
  background:hsl(var(--h,222) 62% 55% / var(--evt-bg));color:hsl(var(--h,222) 62% var(--evt-tx))}
.moi-row{background:var(--surface-2)}
.moi-row:hover{background:var(--surface-3)}

/* Ajouter sans ouvrir une deuxième carte : la tuile pointillée s'ouvre. */
.tile.add{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:.5rem;background:none;
  box-shadow:none;border:1.5px dashed var(--line-hi);color:var(--dim);font-size:.88rem;font-weight:550;
  min-height:5.2rem;border-radius:26px;transition:color .15s,border-color .15s,background .15s}
.tile.add:hover{color:var(--ink);border-color:var(--ink);background:var(--surface-2);transform:none}

/* ── Accueil : mes classes à gauche, la porte toujours ouverte à droite —
   l'écran sert en entier, rien ne se cache derrière un clic. ── */
.accueil{display:grid;grid-template-columns:minmax(0,1fr) clamp(21rem,31vw,26rem);gap:1.1rem;align-items:start}
.accueil>div{display:flex;flex-direction:column;gap:1.1rem;min-width:0}
.accueil .segs{align-self:stretch}
.accueil .seg{flex:1 1 0}
.accueil .btn.grand,.accueil .cases{max-width:none}
.accueil .volet .field{max-width:none !important}
@media (max-width:900px){.accueil{grid-template-columns:minmax(0,1fr)}}

/* Une salle de classe au trait — elle meuble le vide sans le crier. */
.illu{display:flex;flex-direction:column;gap:.85rem;padding:1.35rem 1.45rem 1.25rem}
.illu svg{width:100%;height:auto;display:block}
.illu p{font-size:.82rem;line-height:1.55;color:var(--dim)}

@media (max-width:760px){
  .split{grid-template-columns:minmax(0,1fr)}
  .row .stamp{width:4.6rem}
}
/* Téléphone : moins de marge perdue, des cibles pleine largeur, et rien
   qui déborde — les rangées passent sur deux lignes plutôt que de rogner. */
@media (max-width:560px){
  .card{border-radius:22px}
  .pad{padding:1.15rem 1.15rem 1.25rem}
  .tile{padding:1rem 1.1rem 1.05rem}
  .vide{padding:1rem 1.15rem 1.05rem}
  .pied{padding:.8rem 1.15rem 1rem}
  .rows{padding:.3rem .4rem .6rem}
  .row{padding:.7rem .6rem;gap:.7rem}
  .sect{padding:.45rem .25rem .5rem}
  .btn.grand{max-width:none}
  .entree h2{font-size:1.2rem}
  .segs{align-self:stretch}
  .seg{flex:1 1 0}
  .frow .field,.pied .field{flex:1 1 100%}
  .frow .field ~ .btn,.pied .field ~ .btn{flex:1 1 0;min-width:8rem}
  .codetag{width:100%;justify-content:space-between}
  .codebox .btn.solid{width:100%}
  .fil{padding:.9rem .85rem .4rem}
  .msg{max-width:92%}
}
@media (prefers-reduced-motion:reduce){
  .cases.secoue,.case.on::after,.spin,.entre{animation:none}
  .case.on,.tile:hover,.teaser:hover,.btn:active{transform:none}
  .tile .go{transition:none;transform:none}
  .tick path{animation:none;stroke-dashoffset:0}
}
/* ── Tactile — même socle que l'agenda : pas de survol au doigt, pas de
   zoom d'iOS à la mise au point. */
a,button{touch-action:manipulation}
@media (hover:none){
  .tile .go{opacity:.5;transform:none}
}
@media (pointer:coarse){
  .pmeta .field,.row .field,.compo textarea,.cases .raw{font-size:16px}
}
</style>

  </aside>

  <!-- Téléphone : les cinq ancres du tableau passent sous le pouce, comme
       dans l'agenda. D'ici elles quittent la page — c'est leur rôle. -->
  <nav class="tabbar" aria-label="Sections">

<script>
(() => {
  "use strict";

  /* ── Petits outils ─────────────────────────────────────────────── */
  const el = id => document.getElementById(id);
  const mk = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; };
  const HUES = [150,190,222,264,312,344,22,48];
  const DOW = ["dim.","lun.","mar.","mer.","jeu.","ven.","sam."];
  const MOIS = ["janv","févr","mars","avril","mai","juin","juil","août","sept","oct","nov","déc"];
  const pad = n => String(n).padStart(2, "0");
  const fmtJour = s => {
    if (!s) return "";
    const [y, m, d] = s.split("-").map(Number);
    return `${DOW[new Date(y, m - 1, d).getDay()]} ${d} ${MOIS[m - 1]}`;
  };
  const aujourdhui = () => { const t = new Date(); return `${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`; };
  /* Dans une pastille collée au titre qu'elle qualifie, « dans 23 jours »
     mange la ligne : on abrège. */
  const dansCourt = d => {
    const n = Math.round((new Date(d + "T00:00") - new Date(aujourdhui() + "T00:00")) / 864e5);
    return n <= 0 ? "aujourd'hui" : n === 1 ? "demain" : `dans ${n} j`;
  };
  const hhmm = iso => { const t = new Date(iso); return `${pad(t.getHours())}:${pad(t.getMinutes())}`; };
  const heure = () => { const t = new Date(); return `${pad(t.getHours())}:${pad(t.getMinutes())}`; };
  const grow = t => { t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; };
  const SVGNS = "http://www.w3.org/2000/svg";
  const icone = (...ds) => {
    const s = document.createElementNS(SVGNS, "svg");
    s.setAttribute("class", "i"); s.setAttribute("viewBox", "0 0 24 24");
    for (const d of ds) { const p = document.createElementNS(SVGNS, "path"); p.setAttribute("d", d); s.append(p); }
    return s;
  };
  const I_COPIE = ["M8 8V6a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2",
                   "M4 10a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"];
  const I_PARTAGE = ["M12 15.5V4M8.5 7.5 12 4l3.5 3.5", "M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"];
  const I_COCHE = ["M5 12.5l4.5 4.5L19 7.5"];
  const I_PLUS = ["M12 5.5v13M5.5 12h13"];
  const I_FLECHE = ["M4.5 12h14", "M13 6.5 18.5 12 13 17.5"];

  /* Le code d'invitation. L'alphabet écarte les caractères qu'on confond en
     les lisant à voix haute (O/0, I/L/1) : on peut donc filtrer la frappe
     sans jamais bloquer un code réel, et le dire à l'élève. */
  const CODE_ABC = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  const netCode = v => {
    const lien = /#j\/([a-z0-9]{6})/i.exec(String(v || ""));
    let out = "";
    for (const ch of (lien ? lien[1] : String(v || "")).toUpperCase())
      if (CODE_ABC.includes(ch) && out.length < 6) out += ch;
    return out;
  };
  const lienInvite = code => `${location.origin}${location.pathname}#j/${code}`;
  const INVITE = "classes.invite";

  /* Une teinte stable par personne : la liste des élèves se lit d'un coup. */
  const hueDe = s => HUES[[...String(s || "")].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7) % HUES.length];
  const initiale = n => (String(n || "").trim()[0] || "?").toUpperCase();
  function avatar(nom, cle) {
    const a = mk("span", "ava", initiale(nom));
    a.style.setProperty("--h", hueDe(cle || nom));
    a.setAttribute("aria-hidden", "true");
    return a;
  }

  async function copier(txt, ok) {
    try { await navigator.clipboard.writeText(txt); flash(ok, false); return true; }
    catch { flash("Le navigateur a refusé la copie — sélectionne le code à la main."); return false; }
  }

  /* ── Réglages d'affichage, partagés avec l'agenda ────────────────
     La barre latérale vit maintenant sur les deux pages : son pli et le
     thème doivent donc se souvenir d'un côté comme de l'autre, sinon
     replier ici et repartir là-bas donnerait deux barres différentes.
     Ces deux réglages dorment dans le même sac que l'état de l'agenda
     (« agenda.v5 »), dont l'agenda est le propriétaire : on relit le sac
     juste avant d'écrire et on n'y change qu'une clé, pour ne pas écraser
     ce qu'il vient d'y déposer. La collision reste possible : un onglet
     d'agenda ouvert en même temps réécrira tout son état à son prochain
     enregistrement et pourrait reprendre le dessus. On y perdrait une
     préférence, jamais une donnée — c'est le prix de la barre commune,
     et c'est déjà ce qui arrive entre deux onglets d'agenda. */
  /* L'agenda cloisonne désormais son sac PAR COMPTE : « agenda.v5.<uid> »,
     et « agenda.v5 » tout court sans compte. On refait sa résolution — à la
     main, la session se lit plus bas (SB_STORE/SB_COOKIE, mêmes noms) : le
     sac du compte s'il existe, sinon le sac anonyme. */
  const uidPref = (() => {
    try { const s = JSON.parse(localStorage.getItem("agenda.sb")); if (s?.uid) return s.uid; } catch {}
    try {
      const v = document.cookie.split("; ").find(c => c.startsWith("agenda_sess="))?.slice(12);
      return (v ? JSON.parse(decodeURIComponent(v)) : null)?.uid || "";
    } catch { return ""; }
  })();
  const PREF = uidPref && localStorage.getItem(`agenda.v5.${uidPref}`) != null
    ? `agenda.v5.${uidPref}` : "agenda.v5";
  const prefLire = () => { try { return JSON.parse(localStorage.getItem(PREF)) || {}; } catch { return {}; } };
  const prefEcrire = (cle, val) => {
    try { localStorage.setItem(PREF, JSON.stringify({ ...prefLire(), [cle]: val })); } catch {}
  };

  const ICONE_SOLEIL = '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/></svg>';
  const ICONE_LUNE = '<svg class="i" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z"/></svg>';
  let theme = prefLire().theme === "dark" ? "dark" : "light";
  function appliqueTheme() {
    document.documentElement.setAttribute("data-theme", theme);
    el("t-icon").innerHTML = theme === "dark" ? ICONE_SOLEIL : ICONE_LUNE;
    el("t-label").textContent = theme === "dark" ? "Thème clair" : "Thème sombre";
  }
  appliqueTheme();
  el("t-theme").addEventListener("click", () => {
    theme = theme === "dark" ? "light" : "dark";
    appliqueTheme(); prefEcrire("theme", theme);
  });

  /* Le pli. Le CSS fait tout le mouvement ; d'ici on ne pose que la classe.
     Repliée, la barre n'a plus de mots : chaque bouton reprend le sien en
     infobulle, sinon une rangée d'icônes devient une devinette. Entre 761 et
     1080 px le pli est imposé — comme dans l'agenda, où le rail garde la
     semaine entière à l'écran — et le bouton se retire : un réglage qu'on ne
     peut pas changer n'a pas à se montrer. Le choix de l'utilisateur, lui,
     reste intact pour les écrans larges. */
  const mqRail = matchMedia("(min-width:761px) and (max-width:1080px)");
  let sideMini = !!prefLire().sideMini;
  function appliqueSide() {
    const side = document.querySelector(".side"), b = el("side-fold");
    const mini = mqRail.matches || sideMini;
    side.classList.toggle("mini", mini);
    b.hidden = mqRail.matches;
    b.setAttribute("aria-expanded", mini ? "false" : "true");
    b.title = mini ? "Déplier la barre" : "Replier la barre";
    side.querySelectorAll(".navi").forEach(n => {
      const lb = n.querySelector(".lb");
      if (!lb) return;
      if (mini) n.title = lb.textContent.trim();
      else n.removeAttribute("title");
    });
  }
  mqRail.addEventListener("change", appliqueSide);
  /* Le « change » de matchMedia ne part pas dans tous les environnements
     (émulations, certains pivots) : on double d'un filet sur resize, qui ne
     rejoue le pli que si le seuil a réellement basculé. Même précaution que
     dans l'agenda. */
  let etaitRail = mqRail.matches;
  addEventListener("resize", () => {
    if (mqRail.matches === etaitRail) return;
    etaitRail = mqRail.matches; appliqueSide();
  });
  appliqueSide();
  el("side-fold").addEventListener("click", () => {
    sideMini = !sideMini; appliqueSide(); prefEcrire("sideMini", sideMini);
  });

  let flashTimer = null;
  function flash(msg, err = true) {
    const f = el("flash");
    f.textContent = msg; f.hidden = false; f.classList.toggle("err", err);
    clearTimeout(flashTimer);
    flashTimer = setTimeout(() => { f.hidden = true; }, 5000);
  }

  /* ── Session : la même que l'agenda, jamais une deuxième. ──────── */
  const SB_URL = AGENDA_CONFIG.supabaseUrl;
  const SB_KEY = AGENDA_CONFIG.supabaseCleAnon;
  const SB_STORE = "agenda.sb";
  const SB_COOKIE = "agenda_sess";

  const cookieLire = nom =>
    document.cookie.split("; ").find(c => c.startsWith(nom + "="))?.slice(nom.length + 1) || "";
  const cookieEcrire = (nom, val, jours) => {
    document.cookie = `${nom}=${val};path=/;max-age=${Math.round(jours * 86400)};samesite=lax`
      + (location.protocol === "https:" ? ";secure" : "");
  };
  const cookieEffacer = nom => { document.cookie = `${nom}=;path=/;max-age=0;samesite=lax`; };

  /* Deux rangements, comme dans l'agenda : localStorage garde la session
     entière, le cookie garde de quoi renaître (jeton de rafraîchissement,
     identifiant, courriel) pour 400 jours. C'est LUI qui fait qu'arriver ici
     par un lien d'invitation, sans avoir ouvert l'agenda depuis des
     semaines, ne demande pas de se reconnecter. Un cookie posé sur / vaut
     pour les deux pages. */
  const sbCookie = () => {
    try { const v = cookieLire(SB_COOKIE); return v ? JSON.parse(decodeURIComponent(v)) : null; }
    catch { return null; }
  };
  const sbSession = () => {
    let s = null;
    try { s = JSON.parse(localStorage.getItem(SB_STORE)) || null; } catch {}
    if (s?.rt) return s;
    const c = sbCookie();
    return c?.rt ? { at: "", ...c } : s;
  };
  const sbSave = s => {
    try { localStorage.setItem(SB_STORE, JSON.stringify(s)); } catch {}
    if (s?.rt) cookieEcrire(SB_COOKIE,
      encodeURIComponent(JSON.stringify({ rt: s.rt, uid: s.uid, email: s.email })), 400);
  };
  const sbClear = () => { localStorage.removeItem(SB_STORE); cookieEffacer(SB_COOKIE); };
  const uid = () => sbSession()?.uid;

  const SB_FR = [
    [/failed to fetch|networkerror/i, "Pas de réseau — réessaie dans un instant."],
    [/code introuvable/i, "Ce code ne mène à aucune classe. Vérifie-le avec la personne qui te l'a donné."],
    [/JWT|token/i, "Session expirée — reconnecte-toi dans l'agenda."],
    [/non connect/i, "Connecte-toi dans l'agenda d'abord ; la session suivra ici."],
    [/nom de classe invalide/i, "Il faut un nom entre 1 et 80 caractères."],
    [/trop de classes/i, "Tu as déjà créé 20 classes — c'est la limite."],
  ];
  const frErr = e => {
    const m = String(e?.message || e || "");
    for (const [re, fr] of SB_FR) if (re.test(m)) return fr;
    return m;
  };

  /* Un seul rafraîchissement à la fois : le jeton tourne à chaque échange,
     et cette page en lance volontiers plusieurs de front — le sondage, une
     vue qui charge, une sauvegarde qui part. Deux appels avec le même jeton,
     et le second retombe sur un jeton déjà consommé : déconnexion surprise. */
  let sbRenewing = null;
  function sbRefresh() {
    if (sbRenewing) return sbRenewing;
    const rt = sbSession()?.rt;
    if (!rt) return Promise.reject(new Error("pas de session"));
    sbRenewing = (async () => {
      const r = await fetch(`${SB_URL}/auth/v1/token?grant_type=refresh_token`, {
        method: "POST",
        headers: { apikey: SB_KEY, "content-type": "application/json" },
        body: JSON.stringify({ refresh_token: rt }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok || !d.access_token) throw new Error("refresh raté");
      sbSave({ at: d.access_token, rt: d.refresh_token, uid: d.user?.id, email: d.user?.email });
      return d.access_token;
    })().catch(e => {
      /* Hors ligne, on garde la session : c'est le réseau qui manque. Refus
         net du serveur, et le jeton est mort — on repart de la connexion. */
      if (!/failed to fetch|networkerror|load failed/i.test(String(e?.message || e))) {
        sbClear(); el("sortir").hidden = true; el("who").textContent = ""; vueLogin();
      }
      throw e;
    }).finally(() => { sbRenewing = null; });
    return sbRenewing;
  }

  /* Le jeton du moment. Session revenue du cookie seul : il n'y en a pas
     encore, on l'échange ici. Partir avec un jeton vide ne donnerait pas un
     401 mais une réponse anonyme — donc des listes vides, ce qui ressemble à
     « tu n'as aucune classe » plutôt qu'à « reconnecte-toi ». */
  async function sbJeton() {
    const s0 = sbSession();
    if (!s0) return null;
    if (s0.at) return s0.at;
    try { return await sbRefresh(); } catch { return null; }
  }

  /* Un seul chemin vers la base ; le 401 se soigne une fois par refresh,
     sinon on renvoie vers la connexion de l'agenda. */
  async function api(path, init = {}, retry = true) {
    const at = await sbJeton();
    /* Pas de jeton, deux causes bien différentes : ou bien il n'y a plus de
       session — sbRefresh a déjà ramené à la connexion — ou bien le réseau
       manque et la session, elle, est intacte. Surtout ne rien effacer ici :
       hors ligne, une session valide doit survivre. */
    if (!at) {
      if (!sbSession()) { vueLogin(); throw new Error("pas de session"); }
      throw new Error("Pas de réseau — réessaie dans un instant.");
    }
    const r = await fetch(`${SB_URL}/rest/v1/${path}`, {
      ...init,
      headers: { apikey: SB_KEY, authorization: `Bearer ${at}`,
                 "content-type": "application/json", ...(init.headers || {}) },
    });
    if (r.status === 401 && retry && sbSession()?.rt) {
      try { await sbRefresh(); }
      catch { sbClear(); vueLogin(); throw new Error("session expirée"); }
      return api(path, init, false);
    }
    if (!r.ok) {
      const d = await r.json().catch(() => ({}));
      throw new Error(d.message || d.msg || d.hint || `erreur ${r.status}`);
    }
    if (r.status === 204) return null;
    return r.json().catch(() => null);
  }
  const rpc = (fn, body) => api(`rpc/${fn}`, { method: "POST", body: JSON.stringify(body) });

  /* ── Navigation ────────────────────────────────────────────────── */
  function setCrumbs(items) {
    const c = el("crumbs");
    c.replaceChildren();
    items.forEach(([label, href], i) => {
      if (i) c.append(mk("span", "sep", "›"));
      if (href != null && i < items.length - 1) {
        const a = mk("a", null, label); a.href = href; c.append(a);
      } else c.append(mk("b", null, label));
    });
  }

  function sect(titre, ...extras) {
    const s = mk("div", "sect");
    s.append(mk("h2", null, titre), mk("span", "grow"), ...extras);
    return s;
  }

  const chargement = () => { el("vue").replaceChildren(mk("p", "vide", "…")); };

  /* Supprimer se confirme sur le même bouton : un clic arme, le second agit. */
  function armer(btn, fn) {
    let arme = false, t = null;
    const label = btn.textContent;
    const rougeDeNaissance = btn.classList.contains("danger");
    const calme = () => { arme = false; btn.textContent = label; if (!rougeDeNaissance) btn.classList.remove("danger"); };
    btn.addEventListener("click", async () => {
      if (!arme) {
        arme = true; btn.textContent = "Confirmer ?"; btn.classList.add("danger");
        t = setTimeout(calme, 3000);
        return;
      }
      clearTimeout(t);
      try { await fn(); } catch (e) { flash(frErr(e)); calme(); }
    });
  }

  /* La RLS refuse en silence : un DELETE non permis "réussit" sans rien
     effacer. On demande les lignes retirées pour pouvoir le dire. */
  async function suppr(path) {
    const r = await api(path, { method: "DELETE", headers: { prefer: "return=representation" } });
    if (!r || !r.length) throw new Error("Seul l'auteur ou le proprio de la classe peut supprimer ça.");
  }

  /* Une sauvegarde par page : élastique (900 ms), jamais deux en vol. */
  let saver = null, poller = null;
  function faireSaver(fn, apres) {
    let t = null, busy = false, encore = false;
    const run = async () => {
      if (busy) { encore = true; return; }
      busy = true;
      try { await fn(); apres?.(); } catch (e) { flash(frErr(e)); }
      busy = false;
      if (encore) { encore = false; run(); }
    };
    return { poke() { clearTimeout(t); t = setTimeout(run, 900); }, flush() { clearTimeout(t); return run(); } };
  }
  addEventListener("pagehide", () => saver?.flush());
  document.addEventListener("visibilitychange", () => { if (document.hidden) saver?.flush(); });

  /* ── Vues ──────────────────────────────────────────────────────── */

  function vueLogin() {
    setCrumbs([["Classes"]]);
    const attend = localStorage.getItem(INVITE);
    const v = el("vue");
    const c = mk("div", "card entre solo" + (attend ? " dark" : "")); const p = mk("div", "pad entree");
    p.append(mk("h2", null, attend ? "Une classe t'attend" : "Connecte-toi d'abord"));
    p.append(mk("p", "dim sous", attend
      ? `On garde le code ${attend} de côté. Connecte-toi dans l'agenda, reviens ici, et la classe s'ouvrira toute seule.`
      : "Les classes vivent sous ton compte d'agenda. Ouvre l'agenda, connecte-toi, puis reviens — la session suivra toute seule."));
    const a = mk("a", "btn solid grand", "Ouvrir l'agenda");
    a.href = "/"; a.style.textDecoration = "none";
    p.append(a);
    c.append(p); v.replaceChildren(c);
  }

  /* ── Le champ à six cases ───────────────────────────────────────────
     Un code se tape une fois, souvent en le lisant à voix haute, souvent
     au téléphone. Six cases séparées rendent la frappe vérifiable d'un
     coup d'œil ; en dessous, un seul vrai champ transparent, pour que le
     collage, le curseur et le clavier mobile marchent sans acrobatie. */
  function champCode(onPlein) {
    const box = mk("div", "cases");
    const cases = Array.from({ length: 6 }, () => {
      const d = mk("div", "case"); d.setAttribute("aria-hidden", "true"); box.append(d); return d;
    });
    const inp = mk("input", "raw");
    inp.type = "text"; inp.maxLength = 6; inp.autocomplete = "off"; inp.spellcheck = false;
    inp.setAttribute("autocapitalize", "characters");
    inp.setAttribute("aria-label", "Code d'invitation, six caractères");
    box.append(inp);

    let avant = "";
    const peindre = () => {
      const val = inp.value, actif = document.activeElement === inp;
      cases.forEach((d, i) => {
        d.textContent = val[i] || "";
        d.classList.toggle("plein", i < val.length);
        d.classList.toggle("on", actif && i === val.length);
      });
    };
    /* Le curseur reste au bout : taper au milieu d'un code n'a pas de sens,
       et la garde évite la boucle setSelectionRange → select → … */
    const auBout = () => {
      const n = inp.value.length;
      if (inp.selectionStart !== n || inp.selectionEnd !== n) { try { inp.setSelectionRange(n, n); } catch {} }
    };
    inp.addEventListener("input", () => {
      inp.value = netCode(inp.value);
      auBout(); box.classList.remove("bad"); peindre();
      if (inp.value.length === 6 && avant.length < 6) onPlein?.(inp.value);
      avant = inp.value;
    });
    for (const ev of ["focus", "click", "keyup", "select"])
      inp.addEventListener(ev, () => { auBout(); peindre(); });
    inp.addEventListener("blur", peindre);
    peindre();

    return {
      node: box, input: inp,
      get val() { return inp.value; },
      set(v) { inp.value = netCode(v); avant = inp.value; peindre(); },
      focus() { inp.focus(); auBout(); peindre(); },
      erreur() {
        /* Le retrait passe par un minuteur, pas par animationend : sous
           « mouvement réduit » l'animation n'existe pas et l'événement ne
           viendrait jamais. */
        box.classList.remove("secoue");
        void box.offsetWidth;
        box.classList.add("bad", "secoue");
        setTimeout(() => box.classList.remove("secoue"), 450);
        inp.focus(); auBout();
      },
    };
  }

  /* ── Entrer : le code d'abord ───────────────────────────────────────
     Deux volets sous un même toit. « J'ai un code » passe devant : c'est
     le geste de presque tout le monde. Créer une classe, une personne le
     fait une fois pour trente. */
  function carteEntree({ focal = false, code = "", auto = false, sansTitre = false } = {}) {
    const carte = mk("div", "card entre" + (focal ? " dark solo" : ""));
    const p = mk("div", "pad entree");

    if (focal) {
      p.append(mk("h2", null, "Rejoins ta classe"));
      p.append(mk("p", "dim sous", "Entre le code qu'on t'a passé : vous partagerez les cours, les notes de session et le fil de la classe."));
    } else if (!sansTitre) {
      p.append(mk("h3", null, "Rejoindre ou créer une classe"));
    }

    const segs = mk("div", "segs"); segs.setAttribute("role", "tablist");
    const sJ = mk("button", "seg", "J'ai un code");
    const sC = mk("button", "seg", "Créer une classe");
    for (const b of [sJ, sC]) { b.setAttribute("role", "tab"); segs.append(b); }
    p.append(segs);

    const vJ = mk("div", "volet"); vJ.setAttribute("role", "tabpanel");
    const champ = champCode(() => tenter());
    const hint = mk("p", "hint");
    const btnJ = mk("button", "btn solid grand", "Rejoindre la classe");
    const grpJ = mk("div", "grp");
    grpJ.append(mk("p", "label", "Code d'invitation"), champ.node, hint);
    vJ.append(grpJ, btnJ);

    const vC = mk("div", "volet"); vC.hidden = true; vC.setAttribute("role", "tabpanel");
    const nom = mk("input", "field");
    nom.placeholder = "Ex. Sciences nature, gr. 1234"; nom.maxLength = 80;
    nom.style.maxWidth = "21rem";
    nom.setAttribute("aria-label", "Nom de la classe");
    const btnC = mk("button", "btn solid grand", "Créer la classe");
    const grpC = mk("div", "grp");
    grpC.append(mk("p", "label", "Nom de la classe"), nom,
                mk("p", "hint", "Tu recevras un code de six caractères. C'est lui qui fait entrer les autres."));
    vC.append(grpC, btnC);

    p.append(vJ, vC); carte.append(p);

    const DEFAUT = "Six caractères. Le code ne contient jamais O, 0, I ni 1.";
    let vol = false;
    function dire(msg, genre) {
      hint.replaceChildren();
      hint.className = "hint" + (genre === "bad" ? " bad" : "");
      if (genre === "load") hint.append(mk("span", "spin"));
      hint.append(document.createTextNode(msg));
    }
    dire(DEFAUT);

    function onglet(versCode, focus) {
      sJ.setAttribute("aria-selected", String(versCode));
      sC.setAttribute("aria-selected", String(!versCode));
      vJ.hidden = !versCode; vC.hidden = versCode;
      if (focus) (versCode ? champ.focus() : nom.focus());
    }
    sJ.addEventListener("click", () => onglet(true, true));
    sC.addEventListener("click", () => onglet(false, true));
    onglet(true, false);

    async function tenter() {
      if (vol) return;
      const k = champ.val;
      if (k.length < 6) {
        const reste = 6 - k.length;
        dire(`Il manque ${reste} caractère${reste > 1 ? "s" : ""}.`, "bad");
        champ.focus(); return;
      }
      vol = true; btnJ.disabled = true; champ.input.readOnly = true;
      dire("On vérifie le code…", "load");
      try {
        const d = await rpc("agenda_join_class", { p_code: k });
        if (!d || !d.id) throw new Error("Réponse inattendue du serveur — réessaie dans un instant.");
        await vueBienvenue(d);
      } catch (e) {
        vol = false; btnJ.disabled = false; champ.input.readOnly = false;
        champ.erreur(); dire(frErr(e), "bad");
      }
    }
    btnJ.addEventListener("click", tenter);
    champ.input.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); tenter(); } });
    champ.input.addEventListener("input", () => { if (!vol && hint.classList.contains("bad")) dire(DEFAUT); });

    async function creer() {
      const n = nom.value.trim();
      if (!n) { nom.focus(); return; }
      btnC.disabled = true;
      try {
        const d = await rpc("agenda_create_class", { p_nom: n });
        flash(`« ${n} » est ouverte. Le code ${d.code} y fait entrer ta classe.`, false);
        location.hash = `c/${d.id}`;
      } catch (e) { flash(frErr(e)); btnC.disabled = false; }
    }
    btnC.addEventListener("click", creer);
    nom.addEventListener("keydown", e => { if (e.key === "Enter") creer(); });

    if (code) {
      champ.set(code);
      if (auto && champ.val.length === 6) tenter(); else champ.focus();
    }
    return carte;
  }

  /* ── L'image de la classe ───────────────────────────────────────────
     Un tableau, une pile de livres, une plante, un avion en papier : le
     trait des icônes, en grand. Elle habite l'écran d'accueil et dit,
     sans un mot de plus, où on vient d'arriver. */
  const SVG_CLASSE = `
<svg viewBox="0 0 520 300" role="img" aria-label="Une salle de classe dessinée au trait">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="60" y="26" width="270" height="150" rx="12" fill="var(--invert)"/>
    <text x="84" y="74" font-family="ui-monospace,Menlo,monospace" font-size="21" fill="var(--on-invert)" opacity=".92">a² + b² = c²</text>
    <path d="M85 88q11 6 22 0t22 0t22 0t22 0" stroke="var(--on-invert)" stroke-width="1.75" opacity=".4"/>
    <path d="M106 118v36h46z" stroke="var(--on-invert)" stroke-width="1.75" opacity=".85"/>
    <path d="M106 147h7v7" stroke="var(--on-invert)" stroke-width="1.5" opacity=".55"/>
    <path d="M205 152h76M214 150q29-60 58 0" stroke="var(--on-invert)" stroke-width="1.75" opacity=".85"/>
    <path d="M92 184h206" stroke="var(--line-hi)" stroke-width="3.5"/>
