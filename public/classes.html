  function carteIllu(solo = false) {
    const c = mk("div", "card" + (solo ? " entre solo" : ""));
    const w = mk("div", "illu");
    w.innerHTML = SVG_CLASSE;
    w.append(mk("p", null, "Une classe met en commun les cours, les notes de séance, les pages de révision et un fil de discussion — tout le monde y écrit, tout le monde y voit."));
    c.append(w);
    return c;
  }

  /* Un accusé de réception. On vient d'entrer quelque part : autant dire
     où, avec qui, et régler tout de suite la seule chose que la classe
     verra de toi — ton nom. Sans ça, tout le monde s'appelle « Quelqu'un ». */
  async function vueBienvenue(d) {
    localStorage.removeItem(INVITE);
    let nom = d.nom || "ta classe", membres = [], moi = null;
    try {
      const rows = await api(`agenda_classes?id=eq.${d.id}&select=nom,agenda_class_members(user_id,pseudo,joined_at)`);
      if (rows && rows[0]) {
        nom = rows[0].nom || nom;
        membres = rows[0].agenda_class_members || [];
        moi = membres.find(m => m.user_id === uid()) || null;
      }
    } catch {}
    setCrumbs([["Mes classes", "#"], [nom]]);
    const n = membres.length;
    const deja = moi?.joined_at ? Date.now() - new Date(moi.joined_at).getTime() > 6e4 : false;

    const v = el("vue"); v.replaceChildren();
    const carte = mk("div", "card dark entre solo"); const p = mk("div", "pad entree");

    const tete = mk("div", "chap");
    const tick = mk("div", "tick"); tick.append(icone(...I_COCHE));
    const col = mk("div", "col");
    col.append(mk("p", "label", deja ? "Tu y es déjà" : "Bienvenue"));
    col.append(mk("h2", null, nom));
    tete.append(tick, col);
    p.append(tete, mk("p", "dim sous", deja
      ? `Membre depuis ${fmtJour(moi.joined_at.slice(0, 10))} · ${n} élève${n > 1 ? "s" : ""}.`
      : `Vous êtes ${n} dans cette classe. Ce qui s'y écrit est visible par tout le monde.`));

    const ps = mk("input", "field"); ps.maxLength = 40; ps.value = moi?.pseudo || "";
    ps.placeholder = "Ton prénom"; ps.style.maxWidth = "21rem";
    ps.setAttribute("aria-label", "Ton nom dans cette classe");
    const grpN = mk("div", "grp");
    grpN.append(mk("p", "label", "Ton nom dans la classe"), ps,
                mk("p", "hint", "Il apparaît sur tes messages et sur les notes que tu écris."));
    p.append(grpN);

    const go = mk("button", "btn solid grand", "Entrer dans la classe");
    p.append(go);
    const foot = mk("div", "acts");
    const autres = mk("a", "btn quiet", "Voir mes classes");
    autres.href = "#"; autres.style.textDecoration = "none";
    foot.append(autres); p.append(foot);
    carte.append(p); v.append(carte);

    async function entrer() {
      go.disabled = true;
      const val = ps.value.trim();
      if (val && val !== (moi?.pseudo || "")) {
        try {
          await api(`agenda_class_members?class_id=eq.${d.id}&user_id=eq.${uid()}`,
            { method: "PATCH", body: JSON.stringify({ pseudo: val }) });
        } catch (e) { flash(frErr(e)); }
      }
      location.hash = `c/${d.id}`;
    }
    go.addEventListener("click", entrer);
    ps.addEventListener("keydown", e => { if (e.key === "Enter") entrer(); });
  }

  /* Arrivée par un lien d'invitation : le code est déjà là, on n'en
     redemande pas la saisie. */
  function vueRejoindre(code) {
    const k = netCode(code);
    setCrumbs([["Mes classes", "#"], ["Rejoindre"]]);
    const v = el("vue"); v.replaceChildren();
    v.append(carteEntree({ focal: true, code: k, auto: k.length === 6 }));
  }

  async function vueClasses() {
    setCrumbs([["Mes classes"]]);
    chargement();
    const rows = await api("agenda_classes?select=id,nom,code,agenda_class_members(count)&order=created_at.asc");
    const v = el("vue"); v.replaceChildren();

    /* Premier jour : la porte est la page. Pas de carte vide à côté d'un
       formulaire — il n'y a qu'une chose à faire, elle prend l'écran. */
    if (!rows.length) { v.append(carteEntree({ focal: true }), carteIllu(true)); return; }

    /* Deux colonnes : mes classes à gauche, la porte toujours ouverte à
       droite — l'écran entier sert, rien ne se cache derrière un clic. */
    const duo = mk("div", "accueil");
    const gauche = mk("div"), droite = mk("div");

    gauche.append(sect("Mes classes"));
    const grid = mk("div", "grid");
    for (const c of rows) {
      const t = mk("a", "card tile"); t.href = `#c/${c.id}`;
      const ini = mk("span", "tmono", initiale(c.nom));
      ini.style.setProperty("--h", hueDe(c.nom));
      ini.setAttribute("aria-hidden", "true");
      t.append(ini, mk("b", null, c.nom));
      const n = c.agenda_class_members?.[0]?.count ?? 0;
      t.append(mk("span", "meta", `${n} élève${n > 1 ? "s" : ""}`));
      t.append(mk("span", "chipcode mono", c.code));
      const go = mk("span", "go"); go.setAttribute("aria-hidden", "true");
      go.append(icone(...I_FLECHE));
      t.append(go);
      grid.append(t);
    }
    gauche.append(grid);

    droite.append(sect("Créer ou rejoindre"), carteEntree({ sansTitre: true }), carteIllu());
    duo.append(gauche, droite);
    v.append(duo);
  }

  async function vueClasse(id) {
    chargement();
    /* Trois requêtes d'un coup : la classe, la queue du fil, et où j'en suis
       dans ce fil. Les deux dernières ne doivent jamais faire tomber la page. */
    const [rows, fil, marque] = await Promise.all([
      api(`agenda_classes?id=eq.${id}&select=*,agenda_class_members(user_id,pseudo,role,joined_at),agenda_matieres(id,nom,hue,ordre,agenda_cours(count),agenda_revisions(id,titre,date_examen)),agenda_pages(id,titre,updated_at,ordre)`),
      api(`agenda_messages?class_id=eq.${id}&select=id,texte,created_at,user_id&order=created_at.desc&limit=30`).catch(() => []),
      api(`agenda_last_seen?class_id=eq.${id}&user_id=eq.${uid()}&select=seen_at`).catch(() => []),
    ]);
    const c = rows[0];
    if (!c) { flash("Classe introuvable — en fais-tu encore partie ?"); location.hash = ""; return; }
    setCrumbs([["Mes classes", "#"], [c.nom]]);

    const moi = c.agenda_class_members.find(m => m.user_id === uid());
    const proprio = moi?.role === "proprio";
    const membres = [...c.agenda_class_members].sort((a, b) =>
      (b.role === "proprio") - (a.role === "proprio") ||
      (!a.pseudo) - (!b.pseudo) ||
      (a.pseudo || "").localeCompare(b.pseudo || "", "fr"));
    const pseudos = new Map(membres.map(m => [m.user_id, m.pseudo]));
    const mats = [...c.agenda_matieres].sort((a, b) => (a.ordre - b.ordre) || a.nom.localeCompare(b.nom, "fr"));
    const v = el("vue"); v.replaceChildren();

    /* La carte inversée : le nom, le monde, et la porte — le code. Deux
       façons de le passer : à voix haute (on le copie) ou dans un groupe
       (on partage le lien, qui remplit les six cases tout seul). */
    const hd = mk("div", "card dark"); const p = mk("div", "pad entree");
    p.append(mk("h2", null, c.nom));
    p.append(mk("p", "dim sous",
      `${membres.length} élève${membres.length > 1 ? "s" : ""} · ${mats.length} cours`));
    const grpCode = mk("div", "grp");
    grpCode.append(mk("p", "label", "Code d'invitation"));
    const codebox = mk("div", "codebox");
    const tag = mk("button", "codetag");
    tag.append(mk("span", "code", c.code), icone(...I_COPIE));
    tag.title = "Copier le code";
    tag.setAttribute("aria-label", `Copier le code ${c.code.split("").join(" ")}`);
    tag.addEventListener("click", () => copier(c.code, "Code copié — dicte-le à ta classe."));
    const partage = mk("button", "btn solid");
    partage.append(icone(...I_PARTAGE), document.createTextNode(navigator.share ? "Partager l'invitation" : "Copier le lien"));
    partage.addEventListener("click", async () => {
      const url = lienInvite(c.code);
      if (navigator.share) {
        try { await navigator.share({ title: c.nom, text: `Rejoins « ${c.nom} » dans l'agenda.`, url }); return; }
        catch (e) { if (e && e.name === "AbortError") return; }
      }
      copier(url, "Lien copié — colle-le dans le groupe de la classe.");
    });
    codebox.append(tag, partage);
    grpCode.append(codebox, mk("p", "hint", "Ce code ouvre tout ce qui est ici. Donne-le à ta classe, à personne d'autre."));
    p.append(grpCode);
    hd.append(p); v.append(hd);

    /* Ce qui s'en vient. Une révision porte déjà sa date d'examen ; on les
       remonte de toutes les matières, parce qu'un élève pense par semaine,
       pas par matière. */
    const examens = mats
      .flatMap(m => (m.agenda_revisions || []).filter(r => r.date_examen).map(r => ({ ...r, mat: m })))
      .filter(x => x.date_examen >= aujourdhui())
      .sort((a, b) => a.date_examen.localeCompare(b.date_examen));
    if (examens.length) {
      v.append(sect("Examens à venir"));
      const ce = mk("div", "card"); const re = mk("div", "rows");
      for (const x of examens) {
        const a = mk("a", "row"); a.href = `#r/${x.id}`;
        const pip = mk("span", "pip"); pip.style.setProperty("--h", x.mat.hue ?? 222);
        const col = mk("div", "rowcol");
        col.append(mk("b", null, x.titre || "Examen"),
                   /* La date d'abord : c'est elle qui doit survivre à la
                      coupure quand la ligne manque de place. */
                   mk("span", "meta", `${fmtJour(x.date_examen)} · ${x.mat.nom}`));
        a.append(pip, col, mk("span", "badge", dansCourt(x.date_examen)));
        re.append(a);
      }
      ce.append(re); v.append(ce);
    }

    /* ── Cours ── */
    const semerB = mk("button", "btn quiet", "Semer depuis mon horaire");
    v.append(sect("Cours", mats.length ? semerB : mk("span")));

    const champCours = mk("input", "field");
    champCours.placeholder = "Ex. Calcul différentiel"; champCours.maxLength = 80;
    champCours.setAttribute("aria-label", "Nom du nouveau cours");
    const ajC = mk("button", "btn solid", "Ajouter");
    const piedCours = mk("div", "pied"); piedCours.append(champCours, ajC);

    if (mats.length) {
      const grid = mk("div", "grid");
      for (const m of mats) {
        const t = mk("a", "card tile"); t.href = `#m/${m.id}`;
        const pl = mk("div", "pipline");
        const pip = mk("span", "pip"); pip.style.setProperty("--h", m.hue ?? 222);
        pl.append(pip, mk("b", null, m.nom));
        const nc = m.agenda_cours?.[0]?.count ?? 0, nr = (m.agenda_revisions || []).length;
        t.append(pl, mk("span", "meta", `${nc} séance${nc > 1 ? "s" : ""} · ${nr} examen${nr > 1 ? "s" : ""}`));
        grid.append(t);
      }
      /* Ajouter sans poser une deuxième carte sous la grille : la tuile
         pointillée termine la rangée et ouvre le champ à sa place. */
      const addT = mk("button", "card tile add");
      addT.append(icone(...I_PLUS), document.createTextNode("Ajouter un cours"));
      grid.append(addT);
      const carteAdd = mk("div", "card"); carteAdd.hidden = true;
      piedCours.classList.add("nu"); carteAdd.append(piedCours);
      v.append(grid, carteAdd);
      addT.addEventListener("click", () => {
        carteAdd.hidden = false; addT.hidden = true; champCours.focus();
      });
    } else {
      /* Classe neuve : une seule carte dit le vide et offre les deux sorties,
         la meilleure en premier — l'horaire connaît déjà la liste des cours. */
      const vide = mk("div", "card");
      vide.append(mk("p", "vide hi", "Aucun cours ici pour l'instant. Ton horaire en connaît déjà la liste : sème-la en un geste, ou ajoute le premier à la main."));
      const choix = mk("div", "pied nu duo");
      const semerSolo = mk("button", "btn solid", "Semer depuis mon horaire");
      const aMain = mk("button", "btn quiet", "Ajouter à la main");
      choix.append(semerSolo, aMain);
      piedCours.hidden = true;
      vide.append(choix, piedCours);
      v.append(vide);
      aMain.addEventListener("click", () => { choix.hidden = true; piedCours.hidden = false; champCours.focus(); });
      semerSolo.addEventListener("click", () => semer(semerSolo));
    }

    async function ajouterCours(btn) {
      const n = champCours.value.trim(); if (!n) { champCours.focus(); return; }
      btn.disabled = true;
      try {
        await api("agenda_matieres", { method: "POST", body: JSON.stringify([{
          class_id: c.id, nom: n, hue: HUES[mats.length % HUES.length], ordre: mats.length, created_by: uid(),
        }])});
        vueClasse(id);
      } catch (e) { flash(frErr(e)); btn.disabled = false; }
    }
    ajC.addEventListener("click", () => ajouterCours(ajC));
    champCours.addEventListener("keydown", e => { if (e.key === "Enter") ajouterCours(ajC); });

    /* L'horaire scrapé connaît déjà les matières : autant s'en servir. */
    async function semer(btn) {
      btn.disabled = true;
      try {
        const snap = await api("agenda_snapshots?kind=eq.horaire&select=payload");
        const tt = snap?.[0]?.payload?.tt;
        if (!Array.isArray(tt) || !tt.length) { flash("Aucun horaire dans le nuage — ouvre d'abord l'agenda pour qu'il s'y pousse."); btn.disabled = false; return; }
        const vus = new Map();
        for (const e of tt) if (e.code && e.t && !vus.has(e.code)) vus.set(e.code, e.t);
        const deja = new Set(mats.map(m => m.nom.toLowerCase()));
        const neuves = [...vus.entries()].map(([cc, t]) => ({ code_cours: cc, nom: t }))
          .filter(x => !deja.has(x.nom.toLowerCase()))
          .sort((a, b) => a.nom.localeCompare(b.nom, "fr"));
        if (!neuves.length) { flash("Tous les cours de l'horaire sont déjà là.", false); btn.disabled = false; return; }
        await api("agenda_matieres", { method: "POST", body: JSON.stringify(neuves.map((x, i) => ({
          class_id: c.id, nom: x.nom, code_cours: x.code_cours,
          hue: HUES[(mats.length + i) % HUES.length], ordre: mats.length + i, created_by: uid(),
        })))});
        flash(`${neuves.length} cours ajouté${neuves.length > 1 ? "s" : ""} depuis ton horaire.`, false);
        vueClasse(id);
      } catch (e) { flash(frErr(e)); btn.disabled = false; }
    }
    semerB.addEventListener("click", () => semer(semerB));

    /* ── Discussion ── Elle passe avant les notes : c'est ce qu'on rouvre
       dix fois par jour, et le compteur de non-lus n'a de sens qu'en haut. */
    const vus2 = marque?.[0]?.seen_at || "";
    const neufs = fil.filter(m => m.user_id !== uid() && m.created_at > vus2).length;
    v.append(sect("Discussion"));
    const dis = mk("a", "card teaser"); dis.href = `#d/${c.id}`;
    const dh = mk("div", "acts");
    dh.append(mk("b", null, fil.length ? "Le fil de la classe" : "Rien n'a encore été dit"));
    if (neufs) dh.append(mk("span", "pill", neufs >= 30 ? "30+" : String(neufs)));
    if (fil.length) { dh.append(mk("span", "grow"), mk("span", "stamp", hhmm(fil[0].created_at))); }
    dis.append(dh);
    if (fil.length) {
      for (const m of fil.slice(0, 3).reverse()) {
        dis.append(mk("span", "ex", `${m.user_id === uid() ? "Toi" : (pseudos.get(m.user_id) || "Quelqu'un")} — ${m.texte}`));
      }
    } else dis.append(mk("span", "ex libre", "Ouvre le bal : une question, un rappel, une photo du tableau."));
    v.append(dis);

    /* ── Notes générales : ce qui appartient à la classe et à aucun cours. ── */
    v.append(sect("Notes générales"));
    const pages = [...(c.agenda_pages || [])].sort((a, b) => (a.ordre - b.ordre) || (a.titre || "").localeCompare(b.titre || "", "fr"));
    const cg = mk("div", "card");
    if (pages.length) {
      const rg2 = mk("div", "rows");
      for (const pg of pages) {
        const a = mk("a", "row"); a.href = `#p/${pg.id}`;
        const col = mk("div", "rowcol");
        col.append(mk("b", null, pg.titre || "Sans titre"));
        if (pg.updated_at) col.append(mk("span", "meta", `modifiée ${fmtJour(pg.updated_at.slice(0, 10))}`));
        a.append(col, mk("span", "chev", "›"));
        rg2.append(a);
      }
      cg.append(rg2);
    } else {
      cg.append(mk("p", "vide hi", "Rien encore. Une page d'ici appartient à la classe entière — plan de session, coordonnées des profs, liens utiles."));
    }
    const nomP = mk("input", "field");
    nomP.placeholder = "Ex. Plan de session"; nomP.maxLength = 120;
    nomP.setAttribute("aria-label", "Titre de la nouvelle page");
    const ajP = mk("button", "btn solid", "Créer");
    const piedP = mk("div", "pied"); piedP.hidden = true; piedP.append(nomP, ajP);
    const ouvreP = mk("div", "pied");
    const btnP = mk("button", "btn quiet");
    btnP.append(icone(...I_PLUS), document.createTextNode("Nouvelle page"));
    ouvreP.append(btnP);
    cg.append(ouvreP, piedP); v.append(cg);
    btnP.addEventListener("click", () => { ouvreP.hidden = true; piedP.hidden = false; nomP.focus(); });
    async function creerPage() {
      const n = nomP.value.trim(); if (!n) { nomP.focus(); return; }
      ajP.disabled = true;
      try {
        const d = await api("agenda_pages", { method: "POST", headers: { prefer: "return=representation" },
          body: JSON.stringify([{ class_id: c.id, titre: n, ordre: pages.length, created_by: uid(), updated_by: uid() }]) });
        location.hash = `p/${d[0].id}`;
      } catch (e) { flash(frErr(e)); ajP.disabled = false; }
    }
    ajP.addEventListener("click", creerPage);
    nomP.addEventListener("keydown", e => { if (e.key === "Enter") creerPage(); });

    /* ── Élèves. Une initiale colorée par personne : la liste se lit d'un
       coup d'œil. Chacun retouche son nom, le proprio seul retire. ── */
    v.append(sect("Élèves"));
    const cm = mk("div", "card"); const rm = mk("div", "rows");
    for (const m of membres) {
      const mien = m.user_id === uid();
      const r = mk("div", "row" + (mien ? " moi-row" : ""));
      r.append(avatar(m.pseudo, m.user_id));
      if (mien) {
        const ip = mk("input", "field"); ip.value = m.pseudo || ""; ip.maxLength = 40;
        ip.placeholder = "Ton nom"; ip.title = "Ton nom dans cette classe";
        ip.setAttribute("aria-label", "Ton nom dans cette classe");
        const sv = faireSaver(async () => {
          await api(`agenda_class_members?class_id=eq.${c.id}&user_id=eq.${uid()}`,
            { method: "PATCH", body: JSON.stringify({ pseudo: ip.value.trim() || null }) });
        });
        ip.addEventListener("input", () => sv.poke());
        ip.addEventListener("blur", () => sv.flush());
        r.append(ip, mk("span", "badge", "toi"));
      } else {
        const col = mk("div", "rowcol");
        col.append(mk("b", null, m.pseudo || "Sans nom"));
        if (m.joined_at) col.append(mk("span", "meta", `depuis ${fmtJour(m.joined_at.slice(0, 10))}`));
        r.append(col);
      }
      if (m.role === "proprio") r.append(mk("span", "badge", "proprio"));
      r.append(mk("span", "grow"));
      if (proprio && !mien) {
        const out = mk("button", "btn quiet", "Retirer");
        armer(out, async () => {
          await suppr(`agenda_class_members?class_id=eq.${c.id}&user_id=eq.${m.user_id}`);
          vueClasse(id);
        });
        r.append(out);
      }
      rm.append(r);
    }
    cm.append(rm);
    /* Refaire le code invalide l'ancien : c'est une action de ménage, elle
       vit avec les élèves — pas à côté du bouton « copier » qu'on presse
       toutes les semaines. */
    if (proprio) {
      const pr = mk("div", "pied");
      const rg = mk("button", "btn quiet", "Changer le code d'invitation");
      armer(rg, async () => {
        const d = await rpc("agenda_regen_code", { p_class: c.id });
        flash(`Nouveau code : ${d}. L'ancien ne fonctionne plus.`, false);
        vueClasse(id);
      });
      pr.append(rg, mk("span", "hint", "L'ancien cessera de fonctionner aussitôt."));
      cm.append(pr);
    }
    v.append(cm);

    /* Partir, ou tout fermer. */
    const foot = mk("div", "footacts");
    if (proprio) {
      const del = mk("button", "btn danger", "Supprimer la classe");
      armer(del, async () => { await suppr(`agenda_classes?id=eq.${c.id}`); location.hash = ""; });
      foot.append(del);
    } else {
      const out = mk("button", "btn danger", "Quitter la classe");
      armer(out, async () => {
        await api(`agenda_class_members?class_id=eq.${c.id}&user_id=eq.${uid()}`, { method: "DELETE" });
        location.hash = "";
      });
      foot.append(out);
    }
    v.append(foot);
  }

  async function vueMatiere(id) {
    chargement();
    const rows = await api(`agenda_matieres?id=eq.${id}&select=*,agenda_classes(id,nom),agenda_cours(id,titre,jour,created_at),agenda_revisions(id,titre,date_examen)`);
    const m = rows[0];
    if (!m) { flash("Cours introuvable."); location.hash = ""; return; }
    setCrumbs([["Mes classes", "#"], [m.agenda_classes.nom, `#c/${m.class_id}`], [m.nom]]);
    const v = el("vue"); v.replaceChildren();

    /* Cours : du plus récent au plus vieux — on cherche celui d'hier. */
    const nb = mk("button", "btn solid", "+ Nouvelle séance");
    v.append(sect("Séances", nb));
    const cours = [...m.agenda_cours].sort((a, b) =>
      (b.jour || "").localeCompare(a.jour || "") || (b.created_at || "").localeCompare(a.created_at || ""));
    const cc = mk("div", "card");
    if (cours.length) {
      const rl = mk("div", "rows");
      for (const k of cours) {
        const r = mk("a", "row"); r.href = `#k/${k.id}`;
        r.append(mk("span", "stamp", fmtJour(k.jour) || "—"));
        r.append(mk("b", null, k.titre || "Sans titre"));
        r.append(mk("span", "grow"), mk("span", "chev", "›"));
        rl.append(r);
      }
      cc.append(rl);
    } else cc.append(mk("p", "vide", "Aucune séance encore. La première se crée en un clic, datée d'aujourd'hui."));
    v.append(cc);

    nb.addEventListener("click", async () => {
      nb.disabled = true;
      try {
        const d = await api("agenda_cours", { method: "POST", headers: { prefer: "return=representation" },
          body: JSON.stringify([{ matiere_id: m.id, titre: "", jour: aujourdhui(), created_by: uid() }]) });
        location.hash = `k/${d[0].id}`;
      } catch (e) { flash(frErr(e)); nb.disabled = false; }
    });

    /* Pages de révision : une par examen. */
    v.append(sect("Pages de révision"));
    const revs = [...m.agenda_revisions].sort((a, b) => (a.date_examen || "9999").localeCompare(b.date_examen || "9999"));
    const rc = mk("div", "card");
    if (revs.length) {
      const rl = mk("div", "rows");
      for (const r0 of revs) {
        const r = mk("a", "row"); r.href = `#r/${r0.id}`;
        r.append(mk("span", "stamp", fmtJour(r0.date_examen) || "—"));
        r.append(mk("b", null, r0.titre));
        r.append(mk("span", "grow"), mk("span", "chev", "›"));
        rl.append(r);
      }
      rc.append(rl);
    } else rc.append(mk("p", "vide", "Aucune page de révision. Crée-en une par examen : elle fouille ensuite toutes les séances du cours."));
    const pf = mk("div", "pied");
    const ti = mk("input", "field"); ti.placeholder = "Examen (ex. Examen 1 — dérivées)"; ti.maxLength = 120;
    ti.setAttribute("aria-label", "Titre de l'examen");
    const da = mk("input", "field"); da.type = "date"; da.style.flex = "0 1 auto";
    da.setAttribute("aria-label", "Date de l'examen");
    const cr = mk("button", "btn solid", "Créer");
    pf.append(ti, da, cr); rc.append(pf); v.append(rc);

    cr.addEventListener("click", async () => {
      const t = ti.value.trim(); if (!t) { ti.focus(); return; }
      cr.disabled = true;
      try {
        const d = await api("agenda_revisions", { method: "POST", headers: { prefer: "return=representation" },
          body: JSON.stringify([{ matiere_id: m.id, titre: t, date_examen: da.value || null, created_by: uid(), updated_by: uid() }]) });
        location.hash = `r/${d[0].id}`;
      } catch (e) { flash(frErr(e)); cr.disabled = false; }
    });
    ti.addEventListener("keydown", e => { if (e.key === "Enter") cr.click(); });

    const foot = mk("div", "footacts");
    const del = mk("button", "btn danger", "Supprimer la matière");
    armer(del, async () => { await suppr(`agenda_matieres?id=eq.${m.id}`); location.hash = `c/${m.class_id}`; });
    foot.append(del); v.append(foot);
  }

  async function vueCours(id) {
    chargement();
    const rows = await api(`agenda_cours?id=eq.${id}&select=*,agenda_matieres(id,nom,class_id,agenda_classes(id,nom,agenda_class_members(user_id,pseudo))),agenda_notes(id,contenu,created_at,updated_at,updated_by)`);
    const k = rows[0];
    if (!k) { flash("Séance introuvable."); location.hash = ""; return; }
    const mat = k.agenda_matieres;
    setCrumbs([["Mes classes", "#"], [mat.agenda_classes.nom, `#c/${mat.class_id}`], [mat.nom, `#m/${mat.id}`], [k.titre || fmtJour(k.jour) || "Séance"]]);
    const pseudos = new Map(mat.agenda_classes.agenda_class_members.map(x => [x.user_id, x.pseudo]));
    const v = el("vue"); v.replaceChildren();

    const c = mk("div", "card");
    const ti = mk("input", "titre"); ti.placeholder = "Titre de la séance (ex. Cinématique, ch. 2)"; ti.value = k.titre || ""; ti.maxLength = 120;
    const meta = mk("div", "pmeta");
    const da = mk("input", "field"); da.type = "date"; da.value = k.jour || "";
    const pat = mk("span", "pat");
    meta.append(da, mk("span", "grow"), pat);
    const page = mk("textarea", "page");
    page.placeholder = "La page de la séance — toute la classe la voit et peut y écrire.";

    /* Une seule note de page par cours : la plus ancienne fait foi, elle
       naît au premier caractère tapé, jamais avant. */
    const notes = [...k.agenda_notes].sort((a, b) => (a.created_at || "").localeCompare(b.created_at || ""));
    let noteId = notes[0]?.id || null;
    page.value = notes[0]?.contenu || "";
    if (notes[0]?.updated_at) {
      const t = new Date(notes[0].updated_at);
      const qui = pseudos.get(notes[0].updated_by);
      pat.textContent = `modifiée ${pad(t.getHours())}:${pad(t.getMinutes())}${qui ? ` par ${qui}` : ""}`;
    }

    c.append(ti, meta, page); v.append(c);
    requestAnimationFrame(() => grow(page));

    let creation = null;
    saver = faireSaver(async () => {
      const contenu = page.value;
      if (!noteId) {
        if (creation) { await creation; }
        if (!noteId) {
          creation = api("agenda_notes", { method: "POST", headers: { prefer: "return=representation" },
            body: JSON.stringify([{ cours_id: k.id, contenu, created_by: uid(), updated_by: uid() }]) })
            .then(d => { noteId = d[0].id; });
          await creation; creation = null;
          return;
        }
      }
      await api(`agenda_notes?id=eq.${noteId}`, { method: "PATCH",
        body: JSON.stringify({ contenu, updated_by: uid() }) });
    }, () => { pat.textContent = `enregistrée ${heure()}`; });

    page.addEventListener("input", () => { grow(page); saver.poke(); });
    ti.addEventListener("input", () => { tiSaver.poke(); });
    const tiSaver = faireSaver(async () => {
      await api(`agenda_cours?id=eq.${k.id}`, { method: "PATCH", body: JSON.stringify({ titre: ti.value.trim() }) });
    });
    da.addEventListener("change", async () => {
      try { await api(`agenda_cours?id=eq.${k.id}`, { method: "PATCH", body: JSON.stringify({ jour: da.value || null }) }); }
      catch (e) { flash(frErr(e)); }
    });

    const foot = mk("div", "footacts");
    const del = mk("button", "btn danger", "Supprimer cette séance");
    armer(del, async () => { await suppr(`agenda_cours?id=eq.${k.id}`); location.hash = `m/${mat.id}`; });
    foot.append(del); v.append(foot);
  }

  async function vueRevision(id) {
    chargement();
    const rows = await api(`agenda_revisions?id=eq.${id}&select=*,agenda_matieres(id,nom,class_id,agenda_classes(id,nom),agenda_cours(id,titre,jour,agenda_notes(contenu,created_at)))`);
    const r0 = rows[0];
    if (!r0) { flash("Page de révision introuvable."); location.hash = ""; return; }
    const mat = r0.agenda_matieres;
    setCrumbs([["Mes classes", "#"], [mat.agenda_classes.nom, `#c/${mat.class_id}`], [mat.nom, `#m/${mat.id}`], [r0.titre]]);
    const v = el("vue"); v.replaceChildren();

    const split = mk("div", "split");

    /* La page de révision elle-même. */
    const c = mk("div", "card");
    const ti = mk("input", "titre"); ti.value = r0.titre; ti.maxLength = 120;
    const meta = mk("div", "pmeta");
    const da = mk("input", "field"); da.type = "date"; da.value = r0.date_examen || ""; da.title = "Date de l'examen";
    const pat = mk("span", "pat");
    meta.append(mk("span", "pat", "examen le"), da, mk("span", "grow"), pat);
    const page = mk("textarea", "page");
    page.placeholder = "Ce qui rentre à l'examen : fouille les séances à droite et rassemble ici.";
    page.value = r0.contenu || "";
    c.append(ti, meta, page);
    split.append(c);

    saver = faireSaver(async () => {
      await api(`agenda_revisions?id=eq.${r0.id}`, { method: "PATCH",
        body: JSON.stringify({ contenu: page.value, titre: ti.value.trim() || r0.titre,
                               date_examen: da.value || null, updated_by: uid() }) });
    }, () => { pat.textContent = `enregistrée ${heure()}`; });
    page.addEventListener("input", () => { grow(page); saver.poke(); });
    ti.addEventListener("input", () => saver.poke());
    da.addEventListener("change", () => saver.poke());

    /* La fouille : tous les cours de la matière, dépliables, insérables. */
    const rail = mk("div", "card");
    rail.append(sect("Fouiller la matière"));
    const fl = mk("div", "fouille");
    const cours = [...mat.agenda_cours].sort((a, b) => (a.jour || "").localeCompare(b.jour || ""));
    if (!cours.length) fl.append(mk("p", "vide", "Aucune séance dans ce cours encore."));
    for (const k of cours) {
      const d = mk("details");
      const su = mk("summary");
      su.append(mk("span", "stamp", fmtJour(k.jour) || "—"), mk("b", null, k.titre || "Sans titre"));
      d.append(su);
      const notes = [...(k.agenda_notes || [])].sort((a, b) => (a.created_at || "").localeCompare(b.created_at || ""));
      const texte = notes.map(n => n.contenu).filter(Boolean).join("\n\n").trim();
      if (texte) {
        d.append(mk("div", "exc", texte));
        const ins = mk("button", "btn", "Insérer dans la page");
        ins.addEventListener("click", () => {
          const bloc = `— ${k.titre || "Séance"}${k.jour ? ` (${fmtJour(k.jour)})` : ""} —\n${texte}`;
          page.value = (page.value.trim() ? page.value.replace(/\s*$/, "\n\n") : "") + bloc + "\n";
          grow(page); saver.poke();
          flash("Inséré au bas de la page.", false);
        });
        d.append(ins);
      } else d.append(mk("div", "exc off", "Page encore vide."));
      fl.append(d);
    }
    rail.append(fl);
    split.append(rail);
    v.append(split);

    const foot = mk("div", "footacts");
    const del = mk("button", "btn danger", "Supprimer cette page");
    armer(del, async () => { await suppr(`agenda_revisions?id=eq.${r0.id}`); location.hash = `m/${mat.id}`; });
    foot.append(del); v.append(foot);
  }

  /* La page d'une classe : le même geste que la page d'un cours, sans la
     date — elle n'appartient à aucun cours, c'est tout son intérêt. */
  async function vuePage(id) {
    chargement();
    const rows = await api(`agenda_pages?id=eq.${id}&select=*,agenda_classes(id,nom,agenda_class_members(user_id,pseudo))`);
    const g = rows[0];
    if (!g) { flash("Page introuvable."); location.hash = ""; return; }
    setCrumbs([["Mes classes", "#"], [g.agenda_classes.nom, `#c/${g.class_id}`], [g.titre || "Sans titre"]]);
    const pseudos = new Map(g.agenda_classes.agenda_class_members.map(x => [x.user_id, x.pseudo]));
    const v = el("vue"); v.replaceChildren();

    const c = mk("div", "card");
    const ti = mk("input", "titre"); ti.placeholder = "Titre de la page"; ti.value = g.titre || ""; ti.maxLength = 120;
    const meta = mk("div", "pmeta"); const pat = mk("span", "pat");
    meta.append(mk("span", "grow"), pat);
    const page = mk("textarea", "page");
    page.placeholder = "Toute la classe voit cette page et peut y écrire.";
    page.value = g.contenu || "";
    if (g.updated_at) {
      const t = new Date(g.updated_at);
      const qui = pseudos.get(g.updated_by);
      pat.textContent = `modifiée ${pad(t.getHours())}:${pad(t.getMinutes())}${qui ? ` par ${qui}` : ""}`;
    }
    c.append(ti, meta, page); v.append(c);
    requestAnimationFrame(() => grow(page));

    saver = faireSaver(async () => {
      await api(`agenda_pages?id=eq.${g.id}`, { method: "PATCH",
        body: JSON.stringify({ contenu: page.value, titre: ti.value.trim(), updated_by: uid() }) });
    }, () => { pat.textContent = `enregistrée ${heure()}`; });
    page.addEventListener("input", () => { grow(page); saver.poke(); });
    ti.addEventListener("input", () => saver.poke());

    const foot = mk("div", "footacts");
    const del = mk("button", "btn danger", "Supprimer cette page");
    armer(del, async () => { await suppr(`agenda_pages?id=eq.${g.id}`); location.hash = `c/${g.class_id}`; });
    foot.append(del); v.append(foot);
  }

  /* Le fil de la classe. Pas de temps réel : une relance toutes les 4 s tant
     que l'onglet est devant. Pour une classe, l'écart est invisible, et ça
     n'ajoute ni dépendance ni WebSocket à tenir en vie. On ne redemande que
     ce qui est plus récent que le dernier message posé. */
  async function vueFil(classId) {
    chargement();
    const rows = await api(`agenda_classes?id=eq.${classId}&select=id,nom,agenda_class_members(user_id,pseudo,role)`);
    const c = rows[0];
    if (!c) { flash("Classe introuvable — en fais-tu encore partie ?"); location.hash = ""; return; }
    setCrumbs([["Mes classes", "#"], [c.nom, `#c/${c.id}`], ["Discussion"]]);
    const proprio = c.agenda_class_members.find(m => m.user_id === uid())?.role === "proprio";
    const pseudos = new Map(c.agenda_class_members.map(x => [x.user_id, x.pseudo]));
    const v = el("vue"); v.replaceChildren();

    const carte = mk("div", "card");
    const fil = mk("div", "fil");
    const compo = mk("div", "compo");
    const ta = mk("textarea"); ta.rows = 1; ta.placeholder = "Écrire à la classe…"; ta.maxLength = 4000;
    const env = mk("button", "btn solid", "Envoyer");
    compo.append(ta, env);
    carte.append(fil, compo); v.append(carte);

    const vus = new Set();
    let dernier = "", jourPose = "", colle = true;
    fil.addEventListener("scroll", () => {
      colle = fil.scrollHeight - fil.scrollTop - fil.clientHeight < 60;
    });

    function poser(m) {
      if (vus.has(m.id)) return;
      vus.add(m.id);
      const j = m.created_at.slice(0, 10);
      if (j !== jourPose) {
        jourPose = j;
        fil.append(mk("div", "jour", j === aujourdhui() ? "aujourd'hui" : fmtJour(j)));
      }
      const mien = m.user_id === uid();
      const b = mk("div", "msg" + (mien ? " moi" : ""));
      const h = mk("div", "msgh");
      h.append(mk("b", null, mien ? "Toi" : (pseudos.get(m.user_id) || "Quelqu'un")),
               mk("span", "stampt", hhmm(m.created_at)));
      if (mien || proprio) {
        const x = mk("button", "msgx", "supprimer");
        armer(x, async () => { await suppr(`agenda_messages?id=eq.${m.id}`); b.remove(); });
        h.append(x);
      }
      b.append(h, mk("div", "msgt", m.texte));
      fil.append(b);
      if (m.created_at > dernier) dernier = m.created_at;
    }

    /* Marquer sa place : PostgREST fait l'upsert sur la clé (classe, moi). */
    const marquer = () => api("agenda_last_seen", {
      method: "POST", headers: { prefer: "resolution=merge-duplicates" },
      body: JSON.stringify([{ class_id: c.id, user_id: uid(), seen_at: new Date().toISOString() }]),
    }).catch(() => {});

    async function tirer(premier = false) {
      const base = `agenda_messages?class_id=eq.${c.id}&select=id,texte,created_at,user_id`;
      const depuisZero = premier || !dernier;
      const d = (await api(depuisZero
        ? `${base}&order=created_at.desc&limit=80`
        : `${base}&created_at=gt.${encodeURIComponent(dernier)}&order=created_at.asc`)) || [];
      const msgs = depuisZero ? d.slice().reverse() : d;
      if (!msgs.length) return;
      fil.querySelector(".vide")?.remove();
      for (const m of msgs) poser(m);
      if (premier || colle) fil.scrollTop = fil.scrollHeight;
      marquer();
    }

    fil.replaceChildren();
    await tirer(true);
    if (!vus.size) fil.append(mk("p", "vide", "Le fil est vide. Le premier mot est à toi."));
    marquer();

    clearInterval(poller);
    poller = setInterval(() => { if (!document.hidden) tirer().catch(() => {}); }, 4000);

    async function envoyer() {
      const t = ta.value.trim();
      if (!t) { ta.focus(); return; }
      env.disabled = true;
      try {
        const d = await api("agenda_messages", { method: "POST", headers: { prefer: "return=representation" },
          body: JSON.stringify([{ class_id: c.id, user_id: uid(), texte: t }]) });
        fil.querySelector(".vide")?.remove();
        (d || []).forEach(poser);
        ta.value = ""; grow(ta); colle = true; fil.scrollTop = fil.scrollHeight;
      } catch (e) { flash(frErr(e)); }
      env.disabled = false; ta.focus();
    }
    env.addEventListener("click", envoyer);
    ta.addEventListener("input", () => grow(ta));
    ta.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); envoyer(); }
    });
  }

  /* ── Routage par ancre : #c #m #k #r, #p page, #d discussion,
        #j/CODE pour un lien d'invitation ───────────────────────────── */
  async function route() {
    saver?.flush(); saver = null;
    clearInterval(poller); poller = null;
    const s0 = sbSession();
    el("who").textContent = s0?.email ? s0.email.split("@")[0] : "";
    el("sortir").hidden = !s0;
    /* Déconnecté, l'agenda cache sa barre et ne montre que sa porte
       d'entrée : ici aussi. Offrir « Horaire » et « MIO » à quelqu'un qui
       n'a pas de compte, c'est promettre des pages vides. */
    document.body.classList.toggle("lp", !s0);
    el("sb-label").textContent = s0?.email ? s0.email.split("@")[0] : "Connexion";
    const [k, id] = location.hash.slice(1).split("/");
    /* Une invitation doit survivre au détour par la connexion : on la met
       de côté, et on la reprend dès qu'une session existe. */
    if (k === "j" && id) {
      const att = netCode(id);
      if (att) { if (s0) localStorage.removeItem(INVITE); else localStorage.setItem(INVITE, att); }
    }
    if (!s0) { vueLogin(); return; }
    if (!k) {
      const att = localStorage.getItem(INVITE);
      if (att) { localStorage.removeItem(INVITE); location.hash = `j/${att}`; return; }
    }
    try {
      if (k === "c" && id) await vueClasse(id);
      else if (k === "m" && id) await vueMatiere(id);
      else if (k === "k" && id) await vueCours(id);
      else if (k === "r" && id) await vueRevision(id);
      else if (k === "p" && id) await vuePage(id);
      else if (k === "d" && id) await vueFil(id);
      else if (k === "j") vueRejoindre(id || "");
      else await vueClasses();
    } catch (e) {
      if (!/pas de session|session expirée/.test(String(e?.message))) flash(frErr(e));
    }
  }
  /* La porte de sortie. L'appareil oublie la session — cookie compris — et
     le serveur révoque le jeton de rafraîchissement, sinon il resterait
     valable des mois. On repose l'URL à nu plutôt que de la vider : pas de
     hashchange, donc pas de double rendu par-dessus vueLogin(). */
  el("sortir").addEventListener("click", async () => {
    const s0 = sbSession();
    sbClear();
    el("sortir").hidden = true; el("who").textContent = "";
    document.body.classList.add("lp");
    localStorage.removeItem(INVITE);
    history.replaceState(null, "", location.pathname);
    vueLogin();
    if (s0?.at) {
      try {
        await fetch(`${SB_URL}/auth/v1/logout`, { method: "POST",
          headers: { apikey: SB_KEY, authorization: `Bearer ${s0.at}` } });
      } catch {}
    }
  });

  addEventListener("hashchange", route);
  route();
})();
</script>
